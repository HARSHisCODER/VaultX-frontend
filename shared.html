<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultX — Shared</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css" />
  </head>
  <body>
    <div class="layout-shell">
      <aside class="sidebar">
        <div>
          <a class="brand" href="dashboard.html">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M18 3.25 29.75 7.5v8.68c0 7.48-4.75 13.74-11.75 16.57C11 29.92 6.25 23.66 6.25 16.18V7.5L18 3.25Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" /><path d="m12.7 18.05 3.4 3.4 7.3-7.55" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
            <span>Vault<span>X</span></span>
          </a>
          <p class="brand-sub">Private storage</p>
          <nav class="nav-list" aria-label="Primary">
            <a class="nav-item" href="dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5v8A1.5 1.5 0 0 1 18.5 20h-11A1.5 1.5 0 0 1 6 18.5v-8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>Overview</a>
            <a class="nav-item" href="files.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 6.5A1.5 1.5 0 0 1 6 5h5l2 2h5a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 18 18H6a1.5 1.5 0 0 1-1.5-1.5v-10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>My Files</a>
            <a class="nav-item active" href="shared.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7 8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm10 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5ZM7 20.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm10 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z" stroke="currentColor" stroke-width="1.7"/></svg></span>Shared</a>
            <a class="nav-item" href="settings.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5v15m0-15a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 0-5Zm0 10a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 0-5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>Settings</a>
          </nav>
        </div>
        <div class="tag">Encrypted workspace</div>
      </aside>
      <main class="main-pane">
        <header class="topbar">
          <label class="search-bar" for="search">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="search" type="text" placeholder="Search files and folders" />
          </label>
          <div class="topbar-actions">
            <a class="profile-pill" href="profile.html"><span class="avatar">A</span><span>Alex</span></a>
          </div>
        </header>
        <section class="content-stack">
          <div class="hero-card reveal feature-hover">
            <p class="eyebrow">Collaborations</p>
            <h1>Shared with you</h1>
            <p>Secure files and folders shared by your trusted circle.</p>
          </div>
          <div class="card grid-two reveal feature-hover">
            <div class="row-item reveal feature-hover" style="--delay: .08s"><div><strong>Marketing Board</strong><p>Updated today</p></div><span class="tag">Team</span></div>
            <div class="row-item reveal feature-hover" style="--delay: .14s"><div><strong>Client Review</strong><p>Read-only</p></div><span class="tag">Ready</span></div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/explorer.js"></script>
  </body>
</html>
